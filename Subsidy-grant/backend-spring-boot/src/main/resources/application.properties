# Spring Application Configuration
spring.application.name=subsidy-grant-system
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:subsidy_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT Secrets
app.jwt.secret=${JWT_SECRET:subsidy-grant-platform-enterprise-secret-key-must-be-at-least-256-bits-long-2025}
app.jwt.expiration-ms=43200000

# Logging
logging.level.com.example.subsidysystem=INFO
logging.level.org.springframework.security=WARN
