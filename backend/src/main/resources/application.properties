server.port=${PORT:8080}

# ===============================
# MySQL Database Configuration
# Maps: DATABASE_URL, MYSQL_URL, DATABASE_USERNAME, DATABASE_PASSWORD
# ===============================
spring.datasource.url=${DATABASE_URL:${MYSQL_URL:${SPRING_DATASOURCE_URL:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATABASE_USERNAME:${MYSQLUSER:${DB_USERNAME:}}}
spring.datasource.password=${DATABASE_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:}}}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Cloudinary Configuration
# Maps: CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===============================
# File Upload Limits
# ===============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# JWT Configuration
# Maps: JWT_SECRET
# ===============================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# ===============================
# Cloudflare Turnstile CAPTCHA & Frontend Origin
# Maps: TURNSTILE_SECRET_KEY, FRONTEND_URL
# ===============================
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
app.frontend-url=${FRONTEND_URL:}

# ===============================
# Optional First Administrator Bootstrap
# Maps: BOOTSTRAP_ADMIN_USERNAME, BOOTSTRAP_ADMIN_PASSWORD, BOOTSTRAP_ADMIN_FULL_NAME, BOOTSTRAP_ADMIN_EMAIL
# ===============================
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}

# =======================================================
# Local Development Overrides (Ignored by Git)
# Automatically loads application-local.properties if present locally
# =======================================================
spring.config.import=optional:classpath:application-local.properties,optional:file:application-local.properties
